name: Documentation defect
description: Report unclear, incorrect, missing, or outdated project documentation.
title: "[Docs]: "
labels: []
body:
  - type: input
    id: location
    attributes:
      label: File and section
      placeholder: docs/reference/EVIDENCE-LABELS.md, Derived evidence
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is unclear, incorrect, missing, or outdated.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction or source
      description: Include an official source and version when the issue concerns provider behavior.
  - type: checkboxes
    id: safety
    attributes:
      label: Data confirmation
      options:
        - label: This report contains no protected tenant, customer, credential, or personal data.
          required: true
