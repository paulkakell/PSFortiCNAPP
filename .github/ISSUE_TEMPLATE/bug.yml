name: Module defect
description: Report a reproducible PSFortiCNAPP behavior defect.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: Do not include credentials, real tenant data, personal data, or active vulnerability details.
  - type: input
    id: version
    attributes:
      label: Module version or commit
      placeholder: 0.1.0 or full commit SHA
    validations:
      required: true
  - type: input
    id: powershell
    attributes:
      label: PowerShell version
      placeholder: 7.6.4
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction
      description: Use synthetic or sanitized data and include the exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, customer identifiers, account numbers, personal data, and protected evidence.
          required: true
        - label: This is not an active vulnerability disclosure.
          required: true
